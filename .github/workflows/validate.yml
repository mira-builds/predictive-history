name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: python -m pip install -e . pytest
      # Some tests regenerate indexes: check the committed bytes first.
      - name: Check committed indexes
        run: python -m civ_ph.cli index --check
      - name: Run tests
        run: python -m pytest -q
